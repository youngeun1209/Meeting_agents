<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#7c83f7"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#1e1b4b" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- iOS masks the corners itself, so this is a full-bleed square with no rounding -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- notepad -->
  <g filter="url(#soft)">
    <rect x="252" y="180" width="520" height="664" rx="44" fill="#ffffff"/>
    <!-- torn-off top binding strip -->
    <rect x="252" y="180" width="520" height="96" rx="44" fill="#e8eaff"/>
    <rect x="252" y="248" width="520" height="28" fill="#e8eaff"/>
    <!-- spiral rings -->
    <g fill="#a5b4fc">
      <rect x="330" y="150" width="26" height="86" rx="13"/>
      <rect x="430" y="150" width="26" height="86" rx="13"/>
      <rect x="530" y="150" width="26" height="86" rx="13"/>
      <rect x="630" y="150" width="26" height="86" rx="13"/>
    </g>
    <!-- ruled lines -->
    <g fill="#c7cbe3">
      <rect x="316" y="352" width="392" height="20" rx="10"/>
      <rect x="316" y="424" width="392" height="20" rx="10"/>
      <rect x="316" y="496" width="240" height="20" rx="10"/>
    </g>
  </g>

  <!-- microphone, sitting in front of the lower half of the pad -->
  <g filter="url(#soft)">
    <rect x="452" y="520" width="120" height="212" rx="60" fill="url(#mic)"/>
    <path d="M392 660 a120 120 0 0 0 240 0" fill="none" stroke="url(#mic)" stroke-width="34" stroke-linecap="round"/>
    <rect x="497" y="752" width="30" height="74" rx="15" fill="url(#mic)"/>
    <rect x="432" y="812" width="160" height="32" rx="16" fill="url(#mic)"/>
  </g>
</svg>
